<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" role="img" aria-label="Command buffer strategies compared on a time axis" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif"><text x="90.0" y="26.0" class="ttl" text-anchor="start" font-size="13" font-weight="600">One buffer per kernel</text><text x="259.4" y="26.0" class="lbl" text-anchor="start" font-size="12" font-weight="400">15 to 24 µs of host cost per dispatch</text><text x="78.0" y="53.0" class="lbl" text-anchor="end" font-size="11" font-weight="400">CPU</text><text x="78.0" y="85.0" class="lbl" text-anchor="end" font-size="11" font-weight="400">GPU</text><rect x="90.0" y="42.0" width="18.3" height="14.0" class="c-neutral"/><rect x="183.0" y="74.0" width="41.5" height="14.0" class="c-ultra"/><rect x="224.5" y="42.0" width="18.3" height="14.0" class="c-neutral"/><rect x="317.4" y="74.0" width="41.5" height="14.0" class="c-ultra"/><rect x="358.9" y="42.0" width="18.3" height="14.0" class="c-neutral"/><rect x="451.9" y="74.0" width="41.5" height="14.0" class="c-ultra"/><rect x="493.4" y="42.0" width="18.3" height="14.0" class="c-neutral"/><rect x="586.3" y="74.0" width="41.5" height="14.0" class="c-ultra"/><rect x="627.8" y="42.0" width="18.3" height="14.0" class="c-neutral"/><rect x="720.8" y="74.0" width="41.5" height="14.0" class="c-ultra"/><rect x="762.3" y="42.0" width="18.3" height="14.0" class="c-neutral"/><rect x="855.3" y="74.0" width="41.5" height="14.0" class="c-ultra"/><text x="90.0" y="132.0" class="ttl" text-anchor="start" font-size="13" font-weight="600">One open buffer, this platform</text><text x="326.0" y="132.0" class="lbl" text-anchor="start" font-size="12" font-weight="400">0.11 to 0.12 µs per dispatch, one commit</text><text x="78.0" y="159.0" class="lbl" text-anchor="end" font-size="11" font-weight="400">CPU</text><text x="78.0" y="191.0" class="lbl" text-anchor="end" font-size="11" font-weight="400">GPU</text><rect x="90.0" y="148.0" width="6