<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" role="img" aria-label="Double-float representation and its precision" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif"><rect x="40.0" y="24.0" width="160.0" height="52.0" class="box"/><text x="120.0" y="47.0" class="ttl" text-anchor="middle" font-size="13" font-weight="600">Device memory</text><text x="120.0" y="64.0" class="lbl" text-anchor="middle" font-size="11" font-weight="400">IEEE double, 64 bits</text><rect x="220.0" y="24.0" width="160.0" height="52.0" class="box"/><text x="300.0" y="47.0" class="ttl" text-anchor="middle" font-size="13" font-weight="600">Load</text><text x="300.0" y="64.0" class="lbl" text-anchor="middle" font-size="11" font-weight="400">split into hi + lo</text><line x1="203.0" y1="50.0" x2="217.0" y2="50.0" class="ax" /><rect x="400.0" y="24.0" width="160.0" height="52.0" class="box-hi"/><text x="480.0" y="47.0" class="t-hi" text-anchor="middle" font-size="13" font-weight="600">Registers</text><text x="480.0" y="64.0" class="lbl" text-anchor="middle" font-size="11" font-weight="400">float hi, float lo</text><line x1="383.0" y1="50.0" x2="397.0" y2="50.0" class="ax" /><rect x="580.0" y="24.0" width="160.0" height="52.0" class="box-hi"/><text x="660.0" y="47.0" class="t-hi" text-anchor="middle" font-size="13" font-weight="600">Arithmetic</text><text x="660.0" y="64.0" class="lbl" text-anchor="middle" font-size="11" font-weight="400">error-free sums, fma</text><line x1="563.0" y1="50.0" x2="577.0" y2="50.0" class="ax" /><rect x="760.0" y="24.0" width="160.0" height="52.0" class="box"/><text x="840.0" y="47.0" class="ttl" text-anchor="middle" font-size="13" font-weight="600">Store</text><text x="840.0" y="64.0" class="lbl" text-anchor="middle" font-size="11" font-weight="400">hi + lo to double</text><line x1="743.0" y1="50.0" x2="757.0" y2="50.0" class="ax" /><text x="40.0" y="128.0" class="ttl" text-anchor="start" font-size="13" font-weight="600">Significand bits and unit roundoff</text><text x="158.0" y="169.0" class="lbl" text-anchor="end" font-size="13" font-weight="400">double</text><rect x="170.0" y="154.0" width="636.0" height="22.0" class="c-neutral"/><text x="816.0" y="170.0" class="ttl" text-anchor="start" font-size="12" font-weight="600">53 bits · 1.1e-16</text><text x="158.0" y="213.0" class="lbl" text-anchor="end" font-size="13" font-weight="400">double-float</text><rect x="170.0" y="198.0" width="576.0" height="22.0" class="c-ultra"/><text x="756.0" y="214.0" class="ttl" text-anchor="start" font-size="12" font-weight="600">about 48 bits · 3.6e-15</text><text x="158.0" y="257.0" class="lbl" text-anchor="end" font-size="13" font-weight="400">float</text><rect x="170.0" y="242.0" width="288.0" height="22.0" class="c-cpu"/><text x="468.0" y="258.0" class="ttl" text-anchor="start" font-size="12" font-weight="600">24 bits · 6.0e-8</text><text x="40.0" y="310.0" class="lbl" text-anchor="start" font-size="12" font-weight="400">Measured over one step against a double closed form: 6.7e-15 in position, 4.5e-15 in velocity.</text></svg>
